name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Clé de signature fixe
        env: { KEYSTORE_B64: '${{ secrets.KEYSTORE_B64 }}' }
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::Secret KEYSTORE_B64 manquant"; exit 1; fi
          CLEAN=$(printf '%s' "$KEYSTORE_B64" | tr -cd 'A-Za-z0-9+/=')
          echo "Longueur du secret nettoyé : ${#CLEAN} (attendu : 3564)"
          printf '%s' "$CLEAN" | base64 -d > app/statplayer.jks || { echo "::error::KEYSTORE_B64 incomplet (${#CLEAN}/3564 caractères) : recolle le contenu entier du fichier"; exit 1; }
      - run: gradle assembleRelease --no-daemon
        env: { KEYSTORE_PASSWORD: '${{ secrets.KEYSTORE_PASSWORD }}' }
      - run: cp app/build/outputs/apk/release/app-release.apk StatPlayer-Basket.apk
      - uses: actions/upload-artifact@v4
        with: { name: StatPlayer-Basket-APK, path: StatPlayer-Basket.apk }
      - uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Stat Player Basket v1.0.${{ github.run_number }}
          files: StatPlayer-Basket.apk
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
