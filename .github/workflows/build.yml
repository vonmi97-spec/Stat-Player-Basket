name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Clé de signature fixe (déchiffrée avec le secret KEYSTORE_PASSWORD)
        env: { KEYSTORE_PASSWORD: '${{ secrets.KEYSTORE_PASSWORD }}' }
        run: |
          P=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d ' \n\r')
          echo "Longueur du mot de passe : ${#P} (attendu : 32)"
          printf '%s' "$P" > /tmp/pw
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in app/statplayer.jks.enc -out app/statplayer.jks -pass file:/tmp/pw || { echo "::error::Mot de passe KEYSTORE_PASSWORD incorrect (${#P} caractères)"; exit 1; }
          echo "KEYSTORE_PASSWORD=$P" >> $GITHUB_ENV
          rm /tmp/pw
      - run: gradle assembleRelease --no-daemon
      - run: cp app/build/outputs/apk/release/app-release.apk StatPlayer-Basket.apk
      - uses: actions/upload-artifact@v4
        with: { name: StatPlayer-Basket-APK, path: StatPlayer-Basket.apk }
      - uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Stat Player Basket v1.0.${{ github.run_number }}
          files: StatPlayer-Basket.apk
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
