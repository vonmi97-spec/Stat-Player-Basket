<script>
/* ===== Stockage local uniquement (aucune donnée ne quitte l'appareil) ===== */
/* Chaque compte (ou l'invité) a son propre espace de données, séparé, sur ce téléphone */
const KEY="statplayer_v1",AKEY="statplayer_accounts";
let A=null;try{A=JSON.parse(localStorage.getItem(AKEY))}catch(e){}
if(!A)A={accounts:[],last:null};
function saveA(){try{localStorage.setItem(AKEY,JSON.stringify(A))}catch(e){}}
try{const old=localStorage.getItem(KEY);if(old&&!localStorage.getItem(KEY+"_guest")){localStorage.setItem(KEY+"_guest",old);localStorage.removeItem(KEY);A.last="guest";saveA()}}catch(e){}
let cur=null;const memS={};
const dkey=(c=cur)=>c==="guest"?KEY+"_guest":KEY+"_u_"+c;
function load(c=cur){try{const s=localStorage.getItem(dkey(c));if(s)return JSON.parse(s)}catch(e){}return memS[dkey(c)]||null}
function save(){if(!cur)return;memS[dkey()]=D;try{localStorage.setItem(dkey(),JSON.stringify(D))}catch(e){}}
const blank=()=>({consent:false,pinHash:null,players:[],match:{name:"",opp:"",date:new Date().toISOString().slice(0,10)},stats:{},time:{},onCourt:{},clock:{run:false,start:0,el:0},log:[],history:[],obs:[]});
let D=blank();
let fp=null;
let tab="joueurs",sel=null,unlocked=false;
const acc=()=>A.accounts.find(a=>a.id===cur);
function openSpace(id,already){cur=id;A.last=id;saveA();D=load()||blank();if(!D.history)D.history=[];if(!D.obs)D.obs=[];sel=null;fp=null;tab="joueurs";unlocked=already||!D.pinHash;render()}
function logout(){if(vcur)return toast("Arrête d'abord la vidéo","var(--yl)");commitTimes();save();cur=null;D=blank();unlocked=false;render();toast("Déconnecté","var(--line)")}

const ST=[
 {k:"p2",l:"2 pts",s:"Réussi / raté",c:"#f97316",menu:[["p2","✅","Tir réussi","+2 pts","#16a34a"],["p2M","❌","Tir raté","0 pt","#dc2626"]]},
 {k:"p3",l:"3 pts",s:"Réussi / raté",c:"#8b5cf6",menu:[["p3","✅","Tir réussi","+3 pts","#16a34a"],["p3M","❌","Tir raté","0 pt","#dc2626"]]},
 {k:"lf",l:"Lancer franc",s:"Réussi / raté",c:"#ca8a04",menu:[["lfR","✅","Réussi","+1 pt","#16a34a"],["lfM","❌","Raté","0 pt","#dc2626"]]},
 {k:"reb",l:"Rebond",s:"Offensif / défensif",c:"#2563eb",menu:[["rebO","⬆️","Rebond offensif","",""],["rebD","⬇️","Rebond défensif","",""]]},
 {k:"pas",l:"Passe",s:"Réussie / ratée",c:"#0891b2",menu:[["pas","✅","Passe réussie","",""],["pasM","❌","Passe ratée","","#dc2626"]]},
 {k:"def",l:"Défense",s:"Int. / contre / réussie",c:"#15803d",menu:[["int","🖐️","Interception","",""],["ctr","🚫","Contre","",""],["def","🛡️","Défense réussie","",""]]},
 {k:"per",l:"Perte de balle",s:"Provoquée / personnelle",c:"#db2777",menu:[["perP","🛡️","Perte provoquée","forcée par l'adversaire",""],["perU","🙈","Perte personnelle","erreur du joueur","#7f1d1d"]]},
 {k:"fau",l:"Faute",s:"Provoquée / subie",c:"#dc2626",menu:[["fau","✋","Faute provoquée","commise par le joueur",""],["fsu","🤕","Faute subie","sur le joueur","#b45309"]]}
];
const LAB={p2:"Tir 2 pts réussi",p2M:"Tir 2 pts raté",p3:"Tir 3 pts réussi",p3M:"Tir 3 pts raté",lfR:"Lancer franc réussi",lfM:"Lancer franc raté",reb:"Rebond",rebO:"Rebond offensif",rebD:"Rebond défensif",fsu:"Faute subie",perP:"Perte de balle provoquée",perU:"Perte de balle personnelle",int:"Interception",ctr:"Contre",pas:"Passe réalisée",pasM:"Passe ratée",def:"Défense réussie",per:"Perte de balle",fau:"Faute provoquée"};

const NATIVE=!!window.Android, IOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const STANDALONE=window.navigator.standalone===true||matchMedia("(display-mode: standalone)").matches;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(t,c){const e=$("#toast");e.textContent=t;e.style.background=c||"var(--gr)";e.classList.add("s");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("s"),1300)}

async function hash(s){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("sp-basket:"+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){let h=0;for(const c of "sp-basket:"+s)h=(h*31+c.charCodeAt(0))|0;return"x"+h}}
const S=id=>{const s=D.stats[id]||(D.stats[id]={});KS.forEach(k=>{if(s[k]==null)s[k]=0});return s};
const z=v=>v||0,fgM=s=>z(s.p2)+z(s.p3),fgA=s=>fgM(s)+z(s.p2M)+z(s.p3M),pct=(a,b)=>b?Math.round(a*100/b)+" %":"–";
/* Personnalisation des boutons de stats (ordre + couleurs), propre à chaque compte */
const stOrder=()=>{const ks=ST.map(t=>t.k),o=((D.ui||{}).order||[]).filter(k=>ks.includes(k));return[...o,...ks.filter(k=>!o.includes(k))].map(k=>ST.find(t=>t.k===k))};
const stCol=t=>((D.ui||{}).col||{})[t.k]||t.c;
const DUO={k:"duo",l:"👥 Duo",s:"2 à 5 joueurs",c:"#475569"};
const pts=s=>z(s.p2)*2+z(s.p3)*3+z(s.lfR);
const ev=s=>pts(s)+z(s.reb)+z(s.pas)+z(s.int)+z(s.ctr)+z(s.def)+z(s.fsu)-z(s.per)-z(s.fau)-z(s.lfM)-z(s.p2M)-z(s.p3M);
/* Note générale /100 : adresse /30 + attaque /20 + rebonds & passes /20 + défense /20 + discipline /10 */
const cap=(v,m)=>Math.max(0,Math.min(m,v));
function tsP(s){const fta=z(s.lfR)+z(s.lfM),d=2*(fgA(s)+.44*fta);return d?pts(s)/d:null}
function noteD(s){const fta=z(s.lfR)+z(s.lfM),att=fgA(s)+fta,ts=tsP(s);
 const raw=ts==null?15:cap(ts*50,30),w=Math.min(1,att/6),adr=w*raw+(1-w)*15;
 const P=[["🎯 Adresse",adr,30],["🏀 Attaque",cap(pts(s)*2,20),20],["🤝 Reb. & passes",cap(z(s.reb)*2+z(s.pas)*2.5,20),20],["🛡️ Défense",cap(z(s.def)*3+z(s.int)*4+z(s.ctr)*4+z(s.perP)*3+z(s.fsu)*1.5,20),20],["⚖️ Discipline",cap(10-1.5*z(s.per)-2*Math.max(0,z(s.fau)-1),10),10]];
 return{t:Math.round(P.reduce((a,x)=>a+x[1],0)),P,ts}}
const note=s=>noteD(s).t;
/* Analyse de l'adresse au tir */
function shootTxt(s){const r=(m,a)=>a?Math.round(m*100/a):null,p2A=z(s.p2)+z(s.p2M),p3A=z(s.p3)+z(s.p3M),lfA=z(s.lfR)+z(s.lfM),r2=r(z(s.p2),p2A),r3=r(z(s.p3),p3A),rl=r(z(s.lfR),lfA),rf=r(fgM(s),fgA(s)),ts=tsP(s),o=[];

 if(p3A)o.push(p3A<3?`ℹ️ Peu de tirs à 3 pts (${z(s.p3)}/${p3A}) : pas assez pour juger.`:r3>=33?`✅ Bonne adresse à 3 pts (${r3} %).`:r3>=20?`➖ Adresse moyenne à 3 pts (${r3} %).`:`⚠️ Peu efficace à 3 pts (${r3} %) : privilégier des tirs plus proches.`);
 if(lfA)o.push(lfA<2?`ℹ️ ${z(s.lfR)}/${lfA} aux lancers francs.`:rl>=70?`✅ Fiable aux lancers francs (${rl} %).`:rl>=50?`➖ Lancers francs corrects (${rl} %).`:`⚠️ Lancers francs à travailler (${rl} %).`);
 if(p3A>=4&&p3A>p2A&&r3!=null&&r2!=null&&r3+15<r2)o.push("🧭 Sélection de tirs : beaucoup de 3 pts alors qu'il est bien plus adroit à 2 pts.");
 if(fgA(s)>=10&&rf<30)o.push("🧭 Beaucoup de tirs pour peu de réussite : chercher de meilleures positions ou la passe.");
 if(fgA(s)&&fgA(s)<=3&&pts(s)<4)o.push("🧭 Peu de tirs tentés : il peut oser davantage.");
 if(ts!=null&&fgA(s)+lfA>=4)o.push(`📊 Efficacité réelle au tir : ${Math.round(ts*100)} % (${ts>=.55?"excellente":ts>=.45?"bonne":ts>=.35?"moyenne":"faible"}).`);
 return o}

 return{m:POSTES[o[0][1]],s:o[1][0]>=o[0][0]*.75?POSTES[o[1][1]]:null,pc,R}}

 H.forEach(({m,s})=>{t+=`${m.date}${m.opp?" vs "+m.opp:""} : ${pts(s)} pts, ${s.reb} reb (${z(s.rebO)} off./${z(s.rebD)} déf.), ${s.pas} passes${z(s.pasM)?` (${z(s.pasM)} ratée${z(s.pasM)>1?"s":""})`:""}, ${z(s.int)} int, ${s.ctr} ctr, ${s.def} déf, ${s.per} pertes (${z(s.perP)} prov./${z(s.perU)} pers.), ${s.fau} F, ${z(s.fsu)} FS, LF ${s.lfR}/${s.lfR+s.lfM}, ${fmt(s.min||0)}, note ${note(s)}/100\n`});

const rnd=n=>{const a=new Uint8Array(n);try{crypto.getRandomValues(a)}catch(e){for(let i=0;i<n;i++)a[i]=Math.random()*256|0}return a};
const salt=()=>[...rnd(16)].map(x=>x.toString(16).padStart(2,"0")).join("");
const norm=s=>String(s).toUpperCase().replace(/[^A-Z0-9]/g,"");
function recCode(){const c="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";const s=[...rnd(8)].map(x=>c[x%32]).join("");return s.slice(0,4)+"-"+s.slice(4)}
async function pbk(pw,sl){try{const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);const b=await crypto.subtle.deriveBits({name:"PBKDF2",salt:new TextEncoder().encode(sl),iterations:100000,hash:"SHA-256"},k,256);return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){return hash(sl+":"+pw)}}

/* ===== Partage d'un compte entre plusieurs téléphones (fichier chiffré AES-256) ===== */
const TAG="STATPLAYER-COMPTE-1:";
const b64=u=>{let s="";for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)};
const ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function aesKey(pw,sl){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt:sl,iterations:150000,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}

async function sendFile(name,txt,mime="text/plain"){

 try{const u=URL.createObjectURL(new Blob([txt],{type:mime})),l=document.createElement("a");l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);toast("Fichier téléchargé")}catch(e){try{await navigator.clipboard.writeText(txt);toast("Copié : colle-le dans un message")}catch(x){}}}

 catch(e){ov(`<h2>❌ Synchronisation impossible</h2><p>Ce QR code vient d'un <b>autre compte</b> (ou d'un compte dont le mot de passe a changé). Les deux téléphones doivent être connectés au <b>même compte</b>.</p><p class="mut">Pour installer le compte sur l'autre téléphone : <b>🔗 Partager le compte</b>.</p><div class="row"><button class="b" onclick="syncDlg()">Réessayer</button><button class="b sec" onclick="closeSync()">Fermer</button></div>`);return}
 if(o.acc!==cur)return toast("QR code d'un autre compte","var(--rd)");
 mergeData(D,o.data);const c=D._cnt;delete D._cnt;save();lastSync=c;
 ov(`<h2>✅ Synchronisé</h2><p style="margin-top:0">Reçu de l'autre téléphone :</p>
 <div class="score" style="grid-template-columns:repeat(3,1fr);margin-bottom:10px"><div><b>+${c.p}</b><span>Joueurs</span></div><div><b>+${c.m}</b><span>Matchs</span></div><div><b>+${c.o}</b><span>Notes</span></div></div>
 ${c.u?`<p class="mut" style="margin-top:0">${c.u} feuille(s) de joueur complétée(s) dans des matchs existants.</p>`:""}
 <p>👉 Maintenant, montre <b>ton</b> QR code à l'autre téléphone pour qu'il reçoive aussi tes données.</p>
 <button class="b" style="width:100%;margin-bottom:8px" onclick="showQR()">📱 Montrer mon QR code</button><button class="b sec" style="width:100%" onclick="closeSync()">Terminé</button>`)}

/* ===== Sous-menus des boutons (tirs, lancer franc, défense) ===== */
function stMenu(k){const t=ST.find(x=>x.k===k),c=stCol(t),any=t.menu.some(x=>armed(x[0])),multi=duo&&!duoPs.length;ov(`<h2>${t.l}</h2>
 <div style="display:grid;grid-template-columns:repeat(${t.menu.length},1fr);gap:8px;margin-bottom:10px">${t.menu.map(([key,ic,lab,sub,col])=>`<button class="st" style="position:relative;background:${col||c};min-height:96px;font-size:15px;${any?(armed(key)?`outline:3px solid #fff;outline-offset:2px;transform:scale(1.05);box-shadow:0 0 18px 4px ${col||c};filter:brightness(1.15)`:"opacity:.4;filter:saturate(.5)"):""}" onclick="menuPick('${k}','${key}')">${duo&&armed(key)?`<span style="position:absolute;top:2px;right:6px;font-size:20px">${CN[armed(key)-1]}</span>`:""}<span style="font-size:26px">${ic}</span><br>${lab}${sub?`<small>${sub}</small>`:""}</button>`).join("")}</div>
 ${multi?`<p class="mut" style="margin:0 0 10px;text-align:center">Mode Duo : tu peux en choisir plusieurs (ex. faute provoquée ① + faute subie ②).</p>`:""}
 <button class="b ${multi&&any?"":"sec"}" style="width:100%" onclick="render()">${multi&&any?"✔ OK":any?"Fermer":"Annuler"}</button>`)}
function menuPick(k,key){pickStat(key);if(duo&&!duoPs.length)stMenu(k)}

/* ===== Personnaliser les boutons de stats ===== */
const SW=["#f97316","#ea580c","#dc2626","#b91c1c","#db2777","#ec4899","#8b5cf6","#6366f1","#2563eb","#0891b2","#0d9488","#15803d","#22c55e","#ca8a04","#475569","#64748b"];
let custSel=null;
function custRow(t,i,n,mv){return`<div class="pl" style="padding:8px;flex-wrap:wrap"><span style="width:34px;height:34px;border-radius:10px;background:${stCol(t)};flex:none;border:2px solid ${custSel===t.k?"#fff":"transparent"}" onclick="custSel=custSel==='${t.k}'?null:'${t.k}';custDlg()"></span>
  <div class="nm">${t.l}<div class="mut">${t.s||"&nbsp;"}</div></div>
  ${mv?`<button class="ico" style="opacity:${i?1:.25}" onclick="custMove('${t.k}',-1)">▲</button><button class="ico" style="opacity:${i<n-1?1:.25}" onclick="custMove('${t.k}',1)">▼</button>`:""}
  ${custSel===t.k?`<div style="flex-basis:100%;display:flex;flex-wrap:wrap;gap:8px;margin-top:8px">${SW.map(c=>`<span onclick="custCol('${t.k}','${c}')" style="width:32px;height:32px;border-radius:50%;background:${c};border:3px solid ${stCol(t)===c?"#fff":"transparent"}"></span>`).join("")}
   <label style="width:32px;height:32px;border-radius:50%;background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);position:relative;overflow:hidden"><input type="color" value="${stCol(t)}" onchange="custCol('${t.k}',this.value)" style="opacity:0;position:absolute;inset:0;width:100%;height:100%;padding:0;min-height:0"></label></div>`:""}</div>`}
function custDlg(){if(!D.ui)D.ui={};const L=stOrder();
 ov(`<h2>🎨 Personnaliser les stats</h2><p class="mut" style="margin-top:0">Change l'ordre avec ▲ ▼ et touche la pastille pour choisir une couleur.</p>
 ${L.map((t,i)=>custRow(t,i,L.length,1)).join("")}
 ${custRow(DUO,0,1,0)}
 <div class="row" style="margin-top:6px"><button class="b sec" onclick="if(confirm('Revenir aux couleurs et à l\\'ordre d\\'origine ?')){D.ui={};custSel=null;save();custDlg()}">↺ Par défaut</button><button class="b" onclick="custSel=null;render()">Terminé</button></div>`)}
function custMove(k,d){const o=stOrder().map(t=>t.k),i=o.indexOf(k),j=i+d;if(j<0||j>=o.length)return;[o[i],o[j]]=[o[j],o[i]];D.ui.order=o;save();custDlg()}
function custCol(k,c){D.ui.col=D.ui.col||{};D.ui.col[k]=c;save();custDlg()}

if(A.last==="guest")openSpace("guest");else render();
if(!NATIVE&&location.protocol.startsWith("http")){
 if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
 try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
}
</script>
</body>
</html>
