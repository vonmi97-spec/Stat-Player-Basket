<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stat Player">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0f172a">
<title>Stat Player : Basket</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--line:#334155;--txt:#f1f5f9;--mut:#94a3b8;--or:#f97316;--gr:#22c55e;--rd:#ef4444;--bl:#3b82f6;--yl:#eab308;--pu:#a855f7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--txt);padding-bottom:calc(72px + env(safe-area-inset-bottom));user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
input{-webkit-user-select:text;user-select:text}
header{position:sticky;top:0;z-index:5;background:#020617;padding:calc(4px + env(safe-area-inset-top)) 12px 4px;display:flex;align-items:center;gap:8px;border-bottom:2px solid var(--or);transition:transform .25s}header.hide{transform:translateY(calc(-100% + env(safe-area-inset-top)))}header .ico{font-size:16px;padding:2px 4px}
header h1{font-size:14px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}header h1 span{color:var(--or)}
.ico{background:none;border:0;color:var(--txt);font-size:20px;padding:4px 8px}
main{padding:14px;max-width:720px;margin:auto}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:16px;margin:0 0 10px;color:var(--or)}
input,select,textarea{width:100%;font-family:inherit;-webkit-appearance:none;appearance:none;min-height:46px;padding:12px;border-radius:10px;border:1px solid var(--line);background:#0b1222;color:var(--txt);font-size:16px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
button.b{border:0;border-radius:10px;padding:12px;font-size:15px;font-weight:600;color:#fff;background:var(--or)}
button.sec{background:var(--line)}button.red{background:var(--rd)}button.gr{background:var(--gr)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;padding-bottom:env(safe-area-inset-bottom);background:#020617;border-top:1px solid var(--line);z-index:5}
nav button{flex:1;min-width:0;background:none;border:0;color:var(--mut);padding:8px 0 10px;font-size:11px}
nav button b{display:block;font-size:20px;margin-bottom:2px}nav button.on{color:var(--or)}
.pl{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:#0b1222;margin-bottom:8px}
.num{width:38px;height:38px;border-radius:50%;background:var(--or);display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.pl .nm{flex:1;font-weight:600}.mut{color:var(--mut);font-size:13px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{flex:none;padding:8px 12px;border-radius:20px;background:#0b1222;border:1px solid var(--line);color:var(--txt);font-size:14px}
@keyframes duoGlow{0%,100%{box-shadow:0 0 10px 2px var(--or)}50%{box-shadow:0 0 24px 8px var(--or)}}
.duoOn{animation:duoGlow 1.4s ease-in-out infinite;filter:brightness(1.1)}
.chip.on{background:var(--or);border-color:var(--or)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.st{border:0;border-radius:12px;padding:12px 4px;color:#fff;font-weight:700;font-size:14px;min-height:64px}
.st small{display:block;font-weight:400;font-size:11px;opacity:.85;margin-top:3px}
.score{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.score div{background:#0b1222;border-radius:10px;padding:8px 2px}.score b{display:block;font-size:20px}.score span{font-size:11px;color:var(--mut)}
.clock{font-size:46px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:2px}
.tg{width:54px;height:30px;border-radius:15px;background:var(--line);position:relative;border:0;flex:none}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.tg.on{background:var(--gr)}.tg.on::after{left:27px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px 4px;text-align:center;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:600;font-size:11px}td:first-child,th:first-child{text-align:left}
.tw{overflow-x:auto}
.log{max-height:160px;overflow:auto;font-size:13px}.log div{padding:4px 0;border-bottom:1px solid var(--line)}
#ov{position:fixed;inset:0;background:rgba(2,6,23,.96);z-index:20;display:flex;align-items:center;justify-content:center;padding:20px}
#ov .card{max-width:460px;width:100%;max-height:90vh;overflow:auto}
.pin{display:flex;justify-content:center;gap:12px;margin:14px 0}.pin i{width:16px;height:16px;border-radius:50%;border:2px solid var(--or)}.pin i.f{background:var(--or)}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.kp button{font-size:22px;padding:14px;border-radius:12px;border:0;background:var(--line);color:#fff}
.toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--gr);color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:30;opacity:0;transition:.25s;pointer-events:none}
.toast.s{opacity:1}
.hid{display:none!important}
textarea{min-height:110px;resize:vertical}
.nt{display:inline-block;min-width:40px;padding:3px 7px;border-radius:8px;font-weight:800;color:#fff}
.ob{background:#0b1222;border-radius:10px;padding:10px;margin-bottom:8px;border-left:4px solid var(--or)}
.ob p{margin:4px 0 0;white-space:pre-wrap;-webkit-user-select:text;user-select:text}
tr.lk td{cursor:pointer}
p{line-height:1.45}
</style>
</head>
<body>
<header><h1>🏀 Stat Player : <span>Basket</span></h1><button id="who" class="chip" style="max-width:105px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:3px 9px;font-size:12px" onclick="tab='donnees';render()"></button><button class="ico" onclick="lockNow()" title="Verrouiller">🔒</button></header>
<main id="app"></main>
<nav id="nav">
 <button data-t="joueurs"><b>👥</b>Joueurs</button>
 <button data-t="match"><b>📋</b>Match</button>
 <button data-t="temps"><b>⏱️</b>Temps</button>
 <button data-t="stats"><b>📊</b>Stats</button>
 <button data-t="observer"><b>📝</b>Note</button>
 <button data-t="donnees"><b>🛡️</b>Données</button>
</nav>
<div id="ov" class="hid"></div>
<div class="toast" id="toast"></div>

<script>
/* ===== Stockage local uniquement (aucune donnée ne quitte l'appareil) ===== */
/* Chaque compte (ou l'invité) a son propre espace de données, séparé, sur ce téléphone */
const KEY="statplayer_v1",AKEY="statplayer_accounts";
let A=null;try{A=JSON.parse(localStorage.getItem(AKEY))}catch(e){}
if(!A)A={accounts:[],last:null};
function saveA(){try{localStorage.setItem(AKEY,JSON.stringify(A))}catch(e){}}
try{const old=localStorage.getItem(KEY);if(old&&!localStorage.getItem(KEY+"_guest")){localStorage.setItem(KEY+"_guest",old);localStorage.removeItem(KEY);A.last="guest";saveA()}}catch(e){}
let cur=null;const memS={};
const dkey=(c=cur)=>c==="guest"?KEY+"_guest":KEY+"_u_"+c;
function load(c=cur){try{const s=localStorage.getItem(dkey(c));if(s)return JSON.parse(s)}catch(e){}return memS[dkey(c)]||null}
function save(){if(!cur)return;memS[dkey()]=D;try{localStorage.setItem(dkey(),JSON.stringify(D))}catch(e){}}
const blank=()=>({consent:false,pinHash:null,players:[],match:{name:"",opp:"",date:new Date().toISOString().slice(0,10)},stats:{},time:{},onCourt:{},clock:{run:false,start:0,el:0},log:[],history:[],obs:[]});
let D=blank();
let fp=null;
let tab="joueurs",sel=null,unlocked=false;
const acc=()=>A.accounts.find(a=>a.id===cur);
function openSpace(id,already){cur=id;A.last=id;saveA();D=load()||blank();if(!D.history)D.history=[];if(!D.obs)D.obs=[];sel=null;fp=null;tab="joueurs";unlocked=already||!D.pinHash;render()}
function logout(){if(vcur)return toast("Arrête d'abord la vidéo","var(--yl)");commitTimes();save();cur=null;D=blank();unlocked=false;render();toast("Déconnecté","var(--line)")}

const ST=[
 {k:"p2",l:"2 pts",s:"Réussi / raté",c:"#f97316",menu:[["p2","✅","Tir réussi","+2 pts","#16a34a"],["p2M","❌","Tir raté","0 pt","#dc2626"]]},
 {k:"p3",l:"3 pts",s:"Réussi / raté",c:"#8b5cf6",menu:[["p3","✅","Tir réussi","+3 pts","#16a34a"],["p3M","❌","Tir raté","0 pt","#dc2626"]]},
 {k:"lf",l:"Lancer franc",s:"Réussi / raté",c:"#ca8a04",menu:[["lfR","✅","Réussi","+1 pt","#16a34a"],["lfM","❌","Raté","0 pt","#dc2626"]]},
 {k:"reb",l:"Rebond",s:"Offensif / défensif",c:"#2563eb",menu:[["rebO","⬆️","Rebond offensif","",""],["rebD","⬇️","Rebond défensif","",""]]},
 {k:"pas",l:"Passe",s:"réalisée",c:"#0891b2"},
 {k:"def",l:"Défense",s:"Int. / contre / réussie",c:"#15803d",menu:[["int","🖐️","Interception","",""],["ctr","🚫","Contre","",""],["def","🛡️","Défense réussie","",""]]},
 {k:"per",l:"Perte de balle",s:"Provoquée / personnelle",c:"#db2777",menu:[["perP","🛡️","Perte provoquée","forcée par l'adversaire",""],["perU","🙈","Perte personnelle","erreur du joueur","#7f1d1d"]]},
 {k:"fau",l:"Faute",s:"Provoquée / subie",c:"#dc2626",menu:[["fau","✋","Faute provoquée","commise par le joueur",""],["fsu","🤕","Faute subie","sur le joueur","#b45309"]]}
];
const LAB={p2:"Tir 2 pts réussi",p2M:"Tir 2 pts raté",p3:"Tir 3 pts réussi",p3M:"Tir 3 pts raté",lfR:"Lancer franc réussi",lfM:"Lancer franc raté",reb:"Rebond",rebO:"Rebond offensif",rebD:"Rebond défensif",fsu:"Faute subie",perP:"Perte de balle provoquée",perU:"Perte de balle personnelle",int:"Interception",ctr:"Contre",pas:"Passe réalisée",def:"Défense réussie",per:"Perte de balle",fau:"Faute provoquée"};

const NATIVE=!!window.Android, IOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const STANDALONE=window.navigator.standalone===true||matchMedia("(display-mode: standalone)").matches;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(t,c){const e=$("#toast");e.textContent=t;e.style.background=c||"var(--gr)";e.classList.add("s");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("s"),1300)}
function vib(){try{navigator.vibrate&&navigator.vibrate(25)}catch(e){}}
async function hash(s){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("sp-basket:"+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){let h=0;for(const c of "sp-basket:"+s)h=(h*31+c.charCodeAt(0))|0;return"x"+h}}
const S=id=>{const s=D.stats[id]||(D.stats[id]={});KS.forEach(k=>{if(s[k]==null)s[k]=0});return s};
const z=v=>v||0,fgM=s=>z(s.p2)+z(s.p3),fgA=s=>fgM(s)+z(s.p2M)+z(s.p3M),pct=(a,b)=>b?Math.round(a*100/b)+" %":"–";
/* Personnalisation des boutons de stats (ordre + couleurs), propre à chaque compte */
const stOrder=()=>{const ks=ST.map(t=>t.k),o=((D.ui||{}).order||[]).filter(k=>ks.includes(k));return[...o,...ks.filter(k=>!o.includes(k))].map(k=>ST.find(t=>t.k===k))};
const stCol=t=>((D.ui||{}).col||{})[t.k]||t.c;
const DUO={k:"duo",l:"👥 Duo",s:"2 à 5 joueurs",c:"#475569"};
const pts=s=>z(s.p2)*2+z(s.p3)*3+z(s.lfR);
const ev=s=>pts(s)+z(s.reb)+z(s.pas)+z(s.int)+z(s.ctr)+z(s.def)+z(s.fsu)-z(s.per)-z(s.fau)-z(s.lfM)-z(s.p2M)-z(s.p3M);
/* Note générale /100 : 40 de base + 4 par point d'évaluation (bornée 0–100) */
const note=s=>Math.max(0,Math.min(100,Math.round(40+4*ev(s))));
const nCol=n=>n>=80?"#16a34a":n>=65?"#0d9488":n>=50?"#ca8a04":"#dc2626";
const nLab=n=>n>=80?"Excellent":n>=65?"Bon match":n>=50?"Correct":"À améliorer";
const nB=n=>n==null?"–":`<span class="nt" style="background:${nCol(n)}">${n}</span>`;
const fmt=ms=>{const t=Math.floor(ms/1000);return String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0")};
const clockEl=()=>D.clock.el+(D.clock.run?Date.now()-D.clock.start:0);
function ptime(id){const t=D.time[id]||0;return t+(D.clock.run&&D.onCourt[id]?Date.now()-D.clock.start:0)}

/* ===== Bandeau du haut : se masque quand on descend, réapparaît quand on remonte ===== */
{let ly=0;addEventListener("scroll",()=>{const y=scrollY,h=document.querySelector("header");if(!h)return;if(y<40||y<ly-6)h.classList.remove("hide");else if(y>ly+6)h.classList.add("hide");ly=y},{passive:true})}
/* ===== Navigation ===== */
document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>{vClose();tab=b.dataset.t;render()});
function render(){
 if(!cur)return showAuth(A.accounts.length?"home":"home");
 const w=$("#who");if(w)w.textContent=cur==="guest"?"👋 Invité":"👤 "+(acc()||{}).name;
 if(!D.consent)return showConsent();
 if(!unlocked)return showPin("unlock");
 $("#ov").classList.add("hid");
 document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===(({fiche:"joueurs",videos:"match",video:"match"})[tab]||tab)));
 ({joueurs:vJoueurs,match:vMatch,temps:vTemps,stats:vStats,donnees:vDonnees,fiche:vFiche,observer:vObs,videos:vVids,video:vVid})[tab]();
}

/* ===== Joueurs ===== */
function installHint(){return (IOS&&!STANDALONE)?`<div class="card" style="border:1px solid var(--or)"><h2>📲 Installer sur l'iPhone</h2><p style="margin:0">Dans Safari, touche <b>Partager</b> (carré avec flèche vers le haut) puis <b>« Sur l'écran d'accueil »</b>, puis <b>Ajouter</b>. L'appli s'ouvrira en plein écran, hors connexion, et tes données seront conservées.</p></div>`:""}
function vJoueurs(){
 const st=D.ended?"🏁 Terminé":D.clock.run?"▶️ En cours":(D.clock.el||D.log.length)?"⏸️ En pause":"Pas encore commencé";
 $("#app").innerHTML=installHint()+`<div class="card" style="border:1px solid var(--or)"><h2>${TYPES[mt(D.match)].i} ${TYPES[mt(D.match)].l} ${D.match.opp?"vs "+esc(D.match.opp):"en cours"}</h2>
 <div class="chips" style="margin-bottom:8px;flex-wrap:wrap">${Object.entries(TYPES).map(([k,v])=>`<button class="chip ${mt(D.match)===k?"on":""}" onclick="setType('${k}')">${v.i} ${v.l.replace("Match d'","").replace("Match ","").replace(/^./,c=>c.toUpperCase())}</button>`).join("")}</div>
 <p class="mut" style="margin:0 0 10px">${esc(D.match.date.slice(8,10)+"/"+D.match.date.slice(5,7)+"/"+D.match.date.slice(0,4))} · ${st} · ${D.players.reduce((a,x)=>a+pts(S(x.id)),0)} pts · ${fmt(clockEl())}</p>
 <div class="row"><button class="b red" onclick="newMatch()">🆕 Nouveau match</button>${cur!=="guest"?`<button class="b gr" onclick="syncDlg()">🔄 Synchroniser</button>`:`<button class="b gr" onclick="importDlg()">📥 Rejoindre un compte</button>`}</div></div>
 <div class="card"><h2>Ajouter un joueur</h2>
 <div class="row"><input id="pn" placeholder="Nom du joueur" maxlength="40" style="flex:3"><input id="pnum" placeholder="N°" inputmode="numeric" maxlength="2" style="flex:1"></div>
 <button class="b" style="width:100%;margin-top:10px" onclick="addP()">＋ Ajouter</button></div>
 <div class="card"><h2>Effectif (${D.players.length})</h2>
 ${D.players.length?D.players.map(p=>`<div class="pl"><div class="num">${esc(p.num||"–")}</div><div class="nm" onclick="openFiche('${p.id}')">${esc(p.name)} <span style="color:var(--or)">›</span><div class="mut">${histOf(p.id).length} match(s) enregistré(s) · ${pts(S(p.id))} pts en cours</div></div>
 <button class="ico" onclick="renP('${p.id}')">✏️</button><button class="ico" onclick="delP('${p.id}')">🗑️</button></div>`).join(""):`<p class="mut">Aucun joueur. Ajoute ton effectif ci-dessus.</p>`}</div>`;
 $("#pn").onkeydown=e=>{if(e.key==="Enter")addP()};
}
function addP(){const n=$("#pn").value.trim();if(!n)return toast("Entre un nom","var(--rd)");
 D.players.push({id:"p"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:n,num:$("#pnum").value.replace(/\D/g,"")});save();toast("Joueur ajouté");vJoueurs();$("#pn").focus()}
function renP(id){const p=D.players.find(x=>x.id===id);const n=prompt("Nom du joueur",p.name);if(n&&n.trim()){p.name=n.trim().slice(0,40);const nu=prompt("Numéro",p.num||"");if(nu!==null)p.num=nu.replace(/\D/g,"").slice(0,2);save();render()}}
function delP(id){if(!confirm("Supprimer ce joueur et toutes ses statistiques ?"))return;D.players=D.players.filter(p=>p.id!==id);delete D.stats[id];delete D.time[id];delete D.onCourt[id];D.log=D.log.filter(l=>l.id!==id);D.history.forEach(m=>delete m.players[id]);D.history=D.history.filter(m=>Object.keys(m.players).length);D.obs=D.obs.filter(o=>o.pid!==id);if(sel===id)sel=null;save();render()}

/* ===== Match (saisie stats) ===== */
function vMatch(){
 if(!D.players.length){$("#app").innerHTML=`<div class="card"><p>Ajoute d'abord des joueurs dans l'onglet <b>Joueurs</b>.</p></div>`;return}
 if(!sel||!D.players.find(p=>p.id===sel))sel=D.players[0].id;
 const s=S(sel),p=D.players.find(x=>x.id===sel),lfT=s.lfR+s.lfM;
 const team=D.players.reduce((a,x)=>a+pts(S(x.id)),0);
 $("#app").innerHTML=`<div class="card"><div class="row" style="align-items:center"><div style="flex:1.4;min-width:0"><div class="clock" id="mclk" style="font-size:${VID?32:40}px;text-align:left">${fmt(clockEl())}</div>
 <div class="mut">${D.ended?"🏁 Match terminé":D.clock.run?"▶️ En cours":"⏸️ Chrono arrêté"} · <b style="color:var(--or)">${team} pts</b></div>${vcur?`<div class="mut" id="vst" style="color:var(--rd)">${vStat(vids().find(x=>x.id===vcur))}</div>`:""}</div>
 <div style="flex:1;display:flex;flex-direction:column;gap:6px"><button class="b ${D.clock.run?"red":"gr"}" style="padding:10px" onclick="togClock2()">${D.clock.run?"⏸ Pause":(D.ended||D.clock.el)?"▶ Reprendre":"▶ Démarrer"}</button><button class="b" style="background:#0f766e;padding:10px" onclick="endMatch()">🏁 Terminer</button></div>${vidBtns()}</div></div>
 <div class="card"><h2 style="display:flex;justify-content:space-between;align-items:center">① Choisis la stat<button class="chip" onclick="custDlg()">🎨 Personnaliser</button></h2>
 ${duo?`<p class="mut" style="margin:-4px 0 10px">Mode Duo : choisis <b>2 à 5 stats</b> (①, ②, ③…), puis touche les joueurs dans le même ordre.</p>`:""}<div class="grid">${stOrder().map(t=>{const ms=t.menu?t.menu.filter(x=>armed(x[0])):[],n=t.menu?(ms.length?armed(ms[0][0]):0):armed(t.k),bd=t.menu?ms.map(x=>CN[armed(x[0])-1]).join(""):CN[n-1];

/* Mode Duo : arm = stat en cours, nx = stats suivantes ; duoPs = joueurs déjà servis, duoG = identifiant de l'action groupée */
const CN=["①","②","③","④","⑤"],DMAX=5;
let arm=null,nx=[],duo=false,duoPs=[],duoG=null;
function armed(k){if(arm===k)return duoPs.length+1;const i=nx.indexOf(k);return i<0?0:duoPs.length+2+i}
function togDuo(){duo=!duo;if(!duo){nx=[];if(duoPs.length)arm=null;duoPs=[];duoG=null}render()}
function pickStat(k){
 if(!duo||duoPs.length){arm=arm===k?null:k;return render()}
 const L=[arm,...nx].filter(Boolean),i=L.indexOf(k);
 if(i>=0)L.splice(i,1);else if(L.length<DMAX)L.push(k);else{toast("Maximum "+DMAX+" stats","var(--yl)");return render()}
 arm=L[0]||null;nx=L.slice(1);render()}
function assign(id){if(!arm){sel=id;vMatch();return toast("Choisis d'abord une stat","var(--yl)")}
 if(duoPs.includes(id))return toast("Ce joueur a déjà reçu une stat : choisis-en un autre","var(--yl)");
 sel=id;const k=arm;
 if(nx.length){if(!duoPs.length)duoG=Date.now().toString(36);duoPs.push(id);arm=nx.shift();return rec(k,duoG)}
 const g=duoPs.length?duoG:null;arm=null;duoPs=[];duoG=null;rec(k,g)}
function rec(k,g){D.dirty=true;S(sel)[k]++;if(ALSO[k])S(sel)[ALSO[k]]++;const e={id:sel,k,t:fmt(clockEl())};if(g)e.g=g;vTag(e);D.log.push(e);save();vib();toast("+1 "+LAB[k]+" → "+(D.players.find(x=>x.id===sel)||{}).name);vMatch()}

const TAG="STATPLAYER-COMPTE-1:";
const b64=u=>{let s="";for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)};

  const txt=TAG+b64(s)+"."+b64(iv)+"."+b64(ct),name="StatPlayer-"+norm(a.name).slice(0,20)+"-"+new Date().toISOString().slice(0,10)+".txt";

async function sendFile(name,txt,mime="text/plain"){
 if(window.Android&&Android.shareFileType){if(Android.shareFileType(name,txt,mime))return;return Android.share(txt)}

 try{const f=new File([txt],name,{type:mime});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return}}catch(e){if(e&&e.name==="AbortError")return}
 try{const u=URL.createObjectURL(new Blob([txt],{type:mime})),l=document.createElement("a");l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);toast("Fichier téléchargé")}catch(e){try{await navigator.clipboard.writeText(txt);toast("Copié : colle-le dans un message")}catch(x){}}}

/* Fusion : rien n'est supprimé. Un même match (même date + même adversaire) saisi sur 2 téléphones est regroupé ;

const acts=s=>KS.reduce((a,k)=>a+(s[k]||0),0)+(s.min||0)/60000;
function mergeData(L,I,cnt){cnt=cnt||{p:0,m:0,o:0,u:0};L.players=L.players||[];(I.players||[]).forEach(p=>{const x=L.players.find(q=>q.id===p.id);if(x){x.name=p.name;x.num=p.num}else{L.players.push(p);cnt.p++}});
 L.history=L.history||[];(I.history||[]).forEach(m=>{const k=x=>x.date+"|"+norm(x.opp||"")+"|"+mt(x);let x=L.history.find(q=>q.id===m.id)||L.history.find(q=>k(q)===k(m));
  if(!x){L.history.push(JSON.parse(JSON.stringify(m)));cnt.m++;return}

function custRow(t,i,n,mv){return`<div class="pl" style="padding:8px;flex-wrap:wrap"><span style="width:34px;height:34px;border-radius:10px;background:${stCol(t)};flex:none;border:2px solid ${custSel===t.k?"#fff":"transparent"}" onclick="custSel=custSel==='${t.k}'?null:'${t.k}';custDlg()"></span>
  <div class="nm">${t.l}<div class="mut">${t.s||"&nbsp;"}</div></div>
  ${mv?`<button class="ico" style="opacity:${i?1:.25}" onclick="custMove('${t.k}',-1)">▲</button><button class="ico" style="opacity:${i<n-1?1:.25}" onclick="custMove('${t.k}',1)">▼</button>`:""}
  ${custSel===t.k?`<div style="flex-basis:100%;display:flex;flex-wrap:wrap;gap:8px;margin-top:8px">${SW.map(c=>`<span onclick="custCol('${t.k}','${c}')" style="width:32px;height:32px;border-radius:50%;background:${c};border:3px solid ${stCol(t)===c?"#fff":"transparent"}"></span>`).join("")}
   <label style="width:32px;height:32px;border-radius:50%;background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);position:relative;overflow:hidden"><input type="color" value="${stCol(t)}" onchange="custCol('${t.k}',this.value)" style="opacity:0;position:absolute;inset:0;width:100%;height:100%;padding:0;min-height:0"></label></div>`:""}</div>`}
function custDlg(){if(!D.ui)D.ui={};const L=stOrder();
 ov(`<h2>🎨 Personnaliser les stats</h2><p class="mut" style="margin-top:0">Change l'ordre avec ▲ ▼ et touche la pastille pour choisir une couleur.</p>
 ${L.map((t,i)=>custRow(t,i,L.length,1)).join("")}
 ${custRow(DUO,0,1,0)}
 <div class="row" style="margin-top:6px"><button class="b sec" onclick="if(confirm('Revenir aux couleurs et à l\\'ordre d\\'origine ?')){D.ui={};custSel=null;save();custDlg()}">↺ Par défaut</button><button class="b" onclick="custSel=null;render()">Terminé</button></div>`)}
function custMove(k,d){const o=stOrder().map(t=>t.k),i=o.indexOf(k),j=i+d;if(j<0||j>=o.length)return;[o[i],o[j]]=[o[j],o[i]];D.ui.order=o;save();custDlg()}
function custCol(k,c){D.ui.col=D.ui.col||{};D.ui.col[k]=c;save();custDlg()}

if(A.last==="guest")openSpace("guest");else render();
if(!NATIVE&&location.protocol.startsWith("http")){
 if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
 try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
}
</script>
</body>
</html>
