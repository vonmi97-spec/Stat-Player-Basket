<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stat Player">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0f172a">
<title>Stat Player : Basket</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--line:#334155;--txt:#f1f5f9;--mut:#94a3b8;--or:#f97316;--gr:#22c55e;--rd:#ef4444;--bl:#3b82f6;--yl:#eab308;--pu:#a855f7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--txt);padding-bottom:calc(72px + env(safe-area-inset-bottom));user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
input{-webkit-user-select:text;user-select:text}
header{position:sticky;top:0;z-index:5;background:#020617;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--or)}
header h1{font-size:16px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}header h1 span{color:var(--or)}
.ico{background:none;border:0;color:var(--txt);font-size:20px;padding:4px 8px}
main{padding:14px;max-width:720px;margin:auto}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:16px;margin:0 0 10px;color:var(--or)}
input,select,textarea{width:100%;font-family:inherit;-webkit-appearance:none;appearance:none;min-height:46px;padding:12px;border-radius:10px;border:1px solid var(--line);background:#0b1222;color:var(--txt);font-size:16px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
button.b{border:0;border-radius:10px;padding:12px;font-size:15px;font-weight:600;color:#fff;background:var(--or)}
button.sec{background:var(--line)}button.red{background:var(--rd)}button.gr{background:var(--gr)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;padding-bottom:env(safe-area-inset-bottom);background:#020617;border-top:1px solid var(--line);z-index:5}
nav button{flex:1;min-width:0;background:none;border:0;color:var(--mut);padding:8px 0 10px;font-size:11px}
nav button b{display:block;font-size:20px;margin-bottom:2px}nav button.on{color:var(--or)}
.pl{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:#0b1222;margin-bottom:8px}
.num{width:38px;height:38px;border-radius:50%;background:var(--or);display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.pl .nm{flex:1;font-weight:600}.mut{color:var(--mut);font-size:13px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{flex:none;padding:8px 12px;border-radius:20px;background:#0b1222;border:1px solid var(--line);color:var(--txt);font-size:14px}
.chip.on{background:var(--or);border-color:var(--or)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.st{border:0;border-radius:12px;padding:12px 4px;color:#fff;font-weight:700;font-size:14px;min-height:64px}
.st small{display:block;font-weight:400;font-size:11px;opacity:.85;margin-top:3px}
.score{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.score div{background:#0b1222;border-radius:10px;padding:8px 2px}.score b{display:block;font-size:20px}.score span{font-size:11px;color:var(--mut)}
.clock{font-size:46px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:2px}
.tg{width:54px;height:30px;border-radius:15px;background:var(--line);position:relative;border:0;flex:none}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.tg.on{background:var(--gr)}.tg.on::after{left:27px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px 4px;text-align:center;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:600;font-size:11px}td:first-child,th:first-child{text-align:left}
.tw{overflow-x:auto}
.log{max-height:160px;overflow:auto;font-size:13px}.log div{padding:4px 0;border-bottom:1px solid var(--line)}
#ov{position:fixed;inset:0;background:rgba(2,6,23,.96);z-index:20;display:flex;align-items:center;justify-content:center;padding:20px}
#ov .card{max-width:460px;width:100%;max-height:90vh;overflow:auto}
.pin{display:flex;justify-content:center;gap:12px;margin:14px 0}.pin i{width:16px;height:16px;border-radius:50%;border:2px solid var(--or)}.pin i.f{background:var(--or)}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.kp button{font-size:22px;padding:14px;border-radius:12px;border:0;background:var(--line);color:#fff}
.toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--gr);color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:30;opacity:0;transition:.25s;pointer-events:none}
.toast.s{opacity:1}
.hid{display:none!important}
textarea{min-height:110px;resize:vertical}
.nt{display:inline-block;min-width:40px;padding:3px 7px;border-radius:8px;font-weight:800;color:#fff}
.ob{background:#0b1222;border-radius:10px;padding:10px;margin-bottom:8px;border-left:4px solid var(--or)}
.ob p{margin:4px 0 0;white-space:pre-wrap;-webkit-user-select:text;user-select:text}
tr.lk td{cursor:pointer}
p{line-height:1.45}
</style>
</head>
<body>
<header><h1>🏀 Stat Player : <span>Basket</span></h1><button id="who" class="chip" style="max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:6px 10px" onclick="tab='donnees';render()"></button><button class="ico" onclick="lockNow()" title="Verrouiller">🔒</button></header>
<main id="app"></main>
<nav id="nav">
 <button data-t="joueurs"><b>👥</b>Joueurs</button>
 <button data-t="match"><b>📋</b>Match</button>
 <button data-t="temps"><b>⏱️</b>Temps</button>
 <button data-t="stats"><b>📊</b>Stats</button>
 <button data-t="observer"><b>📝</b>Note</button>
 <button data-t="donnees"><b>🛡️</b>Données</button>
</nav>
<div id="ov" class="hid"></div>
<div class="toast" id="toast"></div>

<script>
/* ===== Stockage local uniquement (aucune donnée ne quitte l'appareil) ===== */
/* Chaque compte (ou l'invité) a son propre espace de données, séparé, sur ce téléphone */
const KEY="statplayer_v1",AKEY="statplayer_accounts";
let A=null;try{A=JSON.parse(localStorage.getItem(AKEY))}catch(e){}
if(!A)A={accounts:[],last:null};
function saveA(){try{localStorage.setItem(AKEY,JSON.stringify(A))}catch(e){}}
try{const old=localStorage.getItem(KEY);if(old&&!localStorage.getItem(KEY+"_guest")){localStorage.setItem(KEY+"_guest",old);localStorage.removeItem(KEY);A.last="guest";saveA()}}catch(e){}
let cur=null;const memS={};
const dkey=(c=cur)=>c==="guest"?KEY+"_guest":KEY+"_u_"+c;
function load(c=cur){try{const s=localStorage.getItem(dkey(c));if(s)return JSON.parse(s)}catch(e){}return memS[dkey(c)]||null}
function save(){if(!cur)return;memS[dkey()]=D;try{localStorage.setItem(dkey(),JSON.stringify(D))}catch(e){}}
const blank=()=>({consent:false,pinHash:null,players:[],match:{name:"",opp:"",date:new Date().toISOString().slice(0,10)},stats:{},time:{},onCourt:{},clock:{run:false,start:0,el:0},log:[],history:[],obs:[]});
let D=blank();
let fp=null;
let tab="joueurs",sel=null,unlocked=false;
const acc=()=>A.accounts.find(a=>a.id===cur);
function openSpace(id,already){cur=id;A.last=id;saveA();D=load()||blank();if(!D.history)D.history=[];if(!D.obs)D.obs=[];sel=null;fp=null;tab="joueurs";unlocked=already||!D.pinHash;render()}
function logout(){commitTimes();save();cur=null;D=blank();unlocked=false;render();toast("Déconnecté","var(--line)")}

const ST=[
 {k:"p2",l:"2 pts",s:"Panier",c:"var(--or)",pts:2},
 {k:"p3",l:"3 pts",s:"Panier",c:"#ea580c",pts:3},
 {k:"lfR",l:"LF ✓",s:"Lancer franc réussi",c:"var(--gr)",pts:1},
 {k:"lfM",l:"LF ✗",s:"Lancer franc raté",c:"#15803d"},
 {k:"reb",l:"Rebond",s:"",c:"var(--bl)"},
 {k:"ctr",l:"Contre",s:"",c:"var(--pu)"},
 {k:"pas",l:"Passe",s:"réalisée",c:"#0891b2"},
 {k:"def",l:"Défense",s:"réussie",c:"#0d9488"},
 {k:"per",l:"Perte",s:"de balle",c:"#b91c1c"},
 {k:"fau",l:"Faute",s:"",c:"var(--rd)"}
];
const LAB={p2:"Panier 2 pts",p3:"Panier 3 pts",lfR:"Lancer franc réussi",lfM:"Lancer franc raté",reb:"Rebond",ctr:"Contre",pas:"Passe réalisée",def:"Défense réussie",per:"Perte de balle",fau:"Faute"};

const NATIVE=!!window.Android, IOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const STANDALONE=window.navigator.standalone===true||matchMedia("(display-mode: standalone)").matches;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(t,c){const e=$("#toast");e.textContent=t;e.style.background=c||"var(--gr)";e.classList.add("s");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("s"),1300)}
function vib(){try{navigator.vibrate&&navigator.vibrate(25)}catch(e){}}
async function hash(s){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("sp-basket:"+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){let h=0;for(const c of "sp-basket:"+s)h=(h*31+c.charCodeAt(0))|0;return"x"+h}}
const S=id=>D.stats[id]||(D.stats[id]={p2:0,p3:0,lfR:0,lfM:0,reb:0,ctr:0,pas:0,def:0,per:0,fau:0});
const pts=s=>s.p2*2+s.p3*3+s.lfR;
const ev=s=>pts(s)+s.reb+s.pas+s.ctr+s.def-s.per-s.fau-s.lfM;
/* Note générale /100 : 40 de base + 4 par point d'évaluation (bornée 0–100) */
const note=s=>Math.max(0,Math.min(100,Math.round(40+4*ev(s))));
const nCol=n=>n>=80?"#16a34a":n>=65?"#0d9488":n>=50?"#ca8a04":"#dc2626";
const nLab=n=>n>=80?"Excellent":n>=65?"Bon match":n>=50?"Correct":"À améliorer";
const nB=n=>n==null?"–":`<span class="nt" style="background:${nCol(n)}">${n}</span>`;
const fmt=ms=>{const t=Math.floor(ms/1000);return String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0")};
const clockEl=()=>D.clock.el+(D.clock.run?Date.now()-D.clock.start:0);
function ptime(id){const t=D.time[id]||0;return t+(D.clock.run&&D.onCourt[id]?Date.now()-D.clock.start:0)}

/* ===== Navigation ===== */
document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
function render(){
 if(!cur)return showAuth(A.accounts.length?"home":"home");
 const w=$("#who");if(w)w.textContent=cur==="guest"?"👋 Invité":"👤 "+(acc()||{}).name;
 if(!D.consent)return showConsent();
 if(!unlocked)return showPin("unlock");
 $("#ov").classList.add("hid");
 document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===(tab==="fiche"?"joueurs":tab)));
 ({joueurs:vJoueurs,match:vMatch,temps:vTemps,stats:vStats,donnees:vDonnees,fiche:vFiche,observer:vObs})[tab]();
}

/* ===== Joueurs ===== */
function installHint(){return (IOS&&!STANDALONE)?`<div class="card" style="border:1px solid var(--or)"><h2>📲 Installer sur l'iPhone</h2><p style="margin:0">Dans Safari, touche <b>Partager</b> (carré avec flèche vers le haut) puis <b>« Sur l'écran d'accueil »</b>, puis <b>Ajouter</b>. L'appli s'ouvrira en plein écran, hors connexion, et tes données seront conservées.</p></div>`:""}
function vJoueurs(){
 const st=D.ended?"🏁 Terminé":D.clock.run?"▶️ En cours":(D.clock.el||D.log.length)?"⏸️ En pause":"Pas encore commencé";
 $("#app").innerHTML=installHint()+`<div class="card" style="border:1px solid var(--or)"><h2>🏀 Match ${D.match.opp?"vs "+esc(D.match.opp):"en cours"}</h2>
 <p class="mut" style="margin:0 0 10px">${esc(D.match.date)} · ${st} · ${D.players.reduce((a,x)=>a+pts(S(x.id)),0)} pts · ${fmt(clockEl())}</p>
 <button class="b red" style="width:100%" onclick="newMatch()">🆕 Nouveau match</button></div>
 <div class="card"><h2>Ajouter un joueur</h2>
 <div class="row"><input id="pn" placeholder="Nom du joueur" maxlength="40" style="flex:3"><input id="pnum" placeholder="N°" inputmode="numeric" maxlength="2" style="flex:1"></div>
 <button class="b" style="width:100%;margin-top:10px" onclick="addP()">＋ Ajouter</button></div>
 <div class="card"><h2>Effectif (${D.players.length})</h2>
 ${D.players.length?D.players.map(p=>`<div class="pl"><div class="num">${esc(p.num||"–")}</div><div class="nm" onclick="openFiche('${p.id}')">${esc(p.name)} <span style="color:var(--or)">›</span><div class="mut">${histOf(p.id).length} match(s) enregistré(s) · ${pts(S(p.id))} pts en cours</div></div>
 <button class="ico" onclick="renP('${p.id}')">✏️</button><button class="ico" onclick="delP('${p.id}')">🗑️</button></div>`).join(""):`<p class="mut">Aucun joueur. Ajoute ton effectif ci-dessus.</p>`}</div>`;
 $("#pn").onkeydown=e=>{if(e.key==="Enter")addP()};
}
function addP(){const n=$("#pn").value.trim();if(!n)return toast("Entre un nom","var(--rd)");
 D.players.push({id:"p"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:n,num:$("#pnum").value.replace(/\D/g,"")});save();toast("Joueur ajouté");vJoueurs();$("#pn").focus()}
function renP(id){const p=D.players.find(x=>x.id===id);const n=prompt("Nom du joueur",p.name);if(n&&n.trim()){p.name=n.trim().slice(0,40);const nu=prompt("Numéro",p.num||"");if(nu!==null)p.num=nu.replace(/\D/g,"").slice(0,2);save();render()}}
function delP(id){if(!confirm("Supprimer ce joueur et toutes ses statistiques ?"))return;D.players=D.players.filter(p=>p.id!==id);delete D.stats[id];delete D.time[id];delete D.onCourt[id];D.log=D.log.filter(l=>l.id!==id);D.history.forEach(m=>delete m.players[id]);D.history=D.history.filter(m=>Object.keys(m.players).length);D.obs=D.obs.filter(o=>o.pid!==id);if(sel===id)sel=null;save();render()}

/* ===== Match (saisie stats) ===== */
function vMatch(){
 if(!D.players.length){$("#app").innerHTML=`<div class="card"><p>Ajoute d'abord des joueurs dans l'onglet <b>Joueurs</b>.</p></div>`;return}
 if(!sel||!D.players.find(p=>p.id===sel))sel=D.players[0].id;
 const s=S(sel),p=D.players.find(x=>x.id===sel),lfT=s.lfR+s.lfM;
 const team=D.players.reduce((a,x)=>a+pts(S(x.id)),0);
 $("#app").innerHTML=`<div class="card"><div class="row"><input id="mo" placeholder="Adversaire" value="${esc(D.match.opp)}"><input id="md" type="date" value="${esc(D.match.date)}"></div>
 <div class="mut" style="margin-top:8px">Score équipe : <b style="color:var(--or);font-size:16px">${team} pts</b> · Chrono ${fmt(clockEl())} ${D.ended?"🏁 terminé":D.clock.run?"▶️":"⏸️"}</div></div>
 <div class="card"><h2>① Choisis la stat</h2><div class="grid">${ST.map(t=>`<button class="st" style="background:${t.c};${arm?(arm===t.k?"outline:3px solid #fff;outline-offset:2px;transform:scale(1.04)":"opacity:.4"):""}" onclick="arm=arm==='${t.k}'?null:'${t.k}';vMatch()">${t.l}<small>${t.s}</small></button>`).join("")}</div></div>
 <div class="card" style="${arm?"border:2px solid var(--or)":""}"><h2>② ${arm?`Attribuer « ${LAB[arm]} » à…`:"Puis touche le joueur"}</h2>
 ${arm?"":`<p class="mut" style="margin:-4px 0 10px">Sélectionne d'abord une stat ci-dessus.</p>`}
 <div class="grid" style="grid-template-columns:repeat(2,1fr)">${[...D.players].sort((a,b)=>(D.onCourt[b.id]?1:0)-(D.onCourt[a.id]?1:0)).map(x=>{const q=S(x.id);return`<button class="st" style="background:${x.id===sel?"#334155":"#0b1222"};border:1px solid ${q.fau>=5?"var(--rd)":"var(--line)"};display:flex;align-items:center;gap:8px;text-align:left;padding:8px;opacity:${arm?1:.6}" onclick="assign('${x.id}')"><span class="num" style="width:32px;height:32px;font-size:14px">${esc(x.num||"–")}</span><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.name)}${D.onCourt[x.id]?" 🟢":""}<small>${pts(q)} pts · ${q.fau} F${q.fau>=5?" ⚠️":""}</small></span></button>`}).join("")}</div></div>
 <div class="row" style="margin-bottom:12px"><button class="b sec" onclick="undo()">↩️ Annuler</button><button class="b sec" onclick="minus()">－1 Corriger</button></div>
 <div class="card"><h2 style="display:flex;justify-content:space-between;align-items:center">${esc(p.name)}<button class="chip" onclick="openFiche('${p.id}')">📈 Fiche (${histOf(p.id).length})</button></h2>
 <div class="score"><div><b>${pts(s)}</b><span>Points</span></div><div><b>${s.reb}</b><span>Rebonds</span></div><div><b>${s.pas}</b><span>Passes</span></div><div><b>${s.lfR}/${lfT}</b><span>LF</span></div>
 <div><b>${s.ctr}</b><span>Contres</span></div><div><b>${s.def}</b><span>Déf. réussies</span></div><div><b>${s.per}</b><span>Pertes</span></div><div><b style="color:${s.fau>=5?"var(--rd)":"inherit"}">${s.fau}</b><span>Fautes</span></div></div>
 ${s.fau>=5?`<p style="color:var(--rd);margin:8px 0 0;font-weight:700">⚠️ 5 fautes – joueur éliminé</p>`:""}</div>
 <div class="card"><h2>Historique</h2><div class="log">${D.log.slice(-30).reverse().map(l=>{const q=D.players.find(x=>x.id===l.id);return`<div><span class="mut">${l.t}</span> · ${esc(q?q.name:"?")} — ${LAB[l.k]}</div>`}).join("")||`<span class="mut">Aucune action</span>`}</div></div>`;
 $("#mo").onchange=e=>{D.match.opp=e.target.value.slice(0,40);save()};
 $("#md").onchange=e=>{D.match.date=e.target.value;save()};
}
let arm=null;
function assign(id){if(!arm){sel=id;vMatch();return toast("Choisis d'abord une stat","var(--yl)")}sel=id;const k=arm;arm=null;rec(k)}
function rec(k){D.dirty=true;S(sel)[k]++;D.log.push({id:sel,k,t:fmt(clockEl())});save();vib();toast("+1 "+LAB[k]+" → "+(D.players.find(x=>x.id===sel)||{}).name);vMatch()}
function undo(){const l=D.log.pop();if(!l)return toast("Rien à annuler","var(--line)");const s=S(l.id);if(s[l.k]>0)s[l.k]--;save();toast("Annulé : "+LAB[l.k],"var(--line)");vMatch()}
function minus(){const ch=prompt("Retirer 1 à quelle stat ?\n"+ST.map((t,i)=>(i+1)+". "+LAB[t.k]).join("\n"));const i=parseInt(ch)-1;if(!(i>=0&&i<ST.length))return;const k=ST[i].k,s=S(sel);if(s[k]>0){s[k]--;for(let j=D.log.length-1;j>=0;j--)if(D.log[j].id===sel&&D.log[j].k===k){D.log.splice(j,1);break}save();toast("−1 "+LAB[k],"var(--line)")}vMatch()}

/* ===== Temps de jeu ===== */
let tick=null;
function commitTimes(){if(!D.clock.run)return;const now=Date.now(),d=now-D.clock.start;for(const id in D.onCourt)if(D.onCourt[id])D.time[id]=(D.time[id]||0)+d;D.clock.el+=d;D.clock.start=now}
function vTemps(){
 const n=Object.values(D.onCourt).filter(Boolean).length;
 $("#app").innerHTML=`<div class="card"><h2>Chronomètre du match</h2><div class="clock" id="clk">${fmt(clockEl())}</div>
 ${D.ended?`<p style="text-align:center;color:var(--or);font-weight:700;margin:6px 0 0">🏁 Match terminé</p>`:""}
 <div class="row" style="margin-top:10px"><button class="b ${D.clock.run?"red":"gr"}" onclick="togClock()">${D.clock.run?"⏸ Pause":D.ended?"▶ Reprendre":D.clock.el?"▶ Reprendre":"▶ Démarrer"}</button><button class="b" style="background:#0f766e" onclick="endMatch()">🏁 Terminer</button></div>
 <button class="b sec" style="width:100%;margin-top:8px" onclick="resetClock()">⟲ Remise à zéro du chrono</button>

/* ===== Comptes locaux, invité, codes de secours ===== */
const rnd=n=>{const a=new Uint8Array(n);try{crypto.getRandomValues(a)}catch(e){for(let i=0;i<n;i++)a[i]=Math.random()*256|0}return a};
const salt=()=>[...rnd(16)].map(x=>x.toString(16).padStart(2,"0")).join("");
const norm=s=>String(s).toUpperCase().replace(/[^A-Z0-9]/g,"");
function recCode(){const c="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";const s=[...rnd(8)].map(x=>c[x%32]).join("");return s.slice(0,4)+"-"+s.slice(4)}
async function pbk(pw,sl){try{const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);const b=await crypto.subtle.deriveBits({name:"PBKDF2",salt:new TextEncoder().encode(sl),iterations:100000,hash:"SHA-256"},k,256);return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){return hash(sl+":"+pw)}}

 else if(v==="login"){ov(`<h2>👤 ${esc(a.name)}</h2>${fld("lp","Mot de passe","password")}<button class="b" style="width:100%" onclick="doLogin()">Se connecter</button>

async function doLogin(){const a=A.accounts.find(x=>x.id===authAcc),pw=$("#lp").value;if(await pbk(pw,a.salt)===a.pw){openSpace(a.id,true);toast("Bienvenue "+a.name)}else{toast("Mot de passe incorrect","var(--rd)");$("#lp").value=""}}
async function doCreate(){const n=$("#cn").value.trim(),e=$("#ce").value.trim(),p1=$("#cp").value,p2=$("#cp2").value,g=$("#cg")&&$("#cg").checked;
 if(!n)return toast("Entre un nom","var(--rd)");if(A.accounts.some(a=>a.name.toLowerCase()===n.toLowerCase()))return toast("Ce nom existe déjà","var(--rd)");
 if(e&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e))return toast("E-mail invalide","var(--rd)");if(p1.length<6)return toast("Mot de passe : 6 caractères minimum","var(--rd)");if(p1!==p2)return toast("Les mots de passe ne correspondent pas","var(--rd)");
 if(cur){commitTimes();save()}
 const a={id:"u"+Date.now().toString(36),name:n.slice(0,30),email:e.slice(0,60),salt:salt(),created:new Date().toISOString().slice(0,10)},c=recCode();a.pw=await pbk(p1,a.salt);a.rec=await pbk(norm(c),a.salt);A.accounts.push(a);saveA();
 if(g){try{const gd=localStorage.getItem(dkey("guest"));if(gd){const o=JSON.parse(gd);o.pinHash=null;o.pinRec=null;localStorage.setItem(dkey(a.id),JSON.stringify(o));localStorage.removeItem(dkey("guest"))}}catch(x){}}
 authAcc=a.id;window._afterCode=()=>openSpace(a.id,true);showCode(c,"mot de passe","_afterCode()")}
async function doResetPw(){const a=A.accounts.find(x=>x.id===authAcc),c=$("#fc").value,p1=$("#fp1").value,p2=$("#fp2").value;
 if(await pbk(norm(c),a.salt)!==a.rec)return toast("Code de secours incorrect","var(--rd)");if(p1.length<6)return toast("Mot de passe : 6 caractères minimum","var(--rd)");if(p1!==p2)return toast("Les mots de passe ne correspondent pas","var(--rd)");
 a.pw=await pbk(p1,a.salt);const nc=recCode();a.rec=await pbk(norm(nc),a.salt);saveA();window._afterCode=()=>openSpace(a.id,true);toast("Mot de passe changé");showCode(nc,"mot de passe (nouveau code)","_afterCode()")}
function delAcc(id,fromAuth){const a=A.accounts.find(x=>x.id===id);if(!confirm(`Supprimer le compte « ${a.name} » et TOUTES ses données ? Action irréversible.`))return;if(!confirm("Confirmer la suppression définitive ?"))return;

/* ===== Partage d'un compte entre plusieurs téléphones (fichier chiffré AES-256) ===== */
const TAG="STATPLAYER-COMPTE-1:";
const b64=u=>{let s="";for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)};
const ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function aesKey(pw,sl){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt:sl,iterations:150000,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
function shareDlg(){const a=acc();ov(`<h2>🔗 Partager « ${esc(a.name)} »</h2>
 <p style="margin-top:0">Crée un <b>fichier chiffré</b> contenant ce compte (joueurs, stats, historique, notes). Envoie-le à l'autre coach (WhatsApp, e-mail, Drive…). Il l'ouvre dans <b>📥 Ouvrir un compte partagé</b> avec le <b>même mot de passe</b>.</p>
 <p class="mut">🔒 Sans le mot de passe, le fichier est illisible. Donne le mot de passe de vive voix, pas dans le même message. Le code PIN de ce téléphone n'est pas partagé.</p>
 ${fld("shp","Mot de passe du compte","password")}<button class="b" style="width:100%" onclick="doShare()">📤 Créer et envoyer le fichier</button><button class="b sec" style="width:100%;margin-top:8px" onclick="render()">Annuler</button>`)}
async function doShare(){const a=acc(),pw=$("#shp").value;if(await pbk(pw,a.salt)!==a.pw)return toast("Mot de passe incorrect","var(--rd)");
 try{commitTimes();save();const d=JSON.parse(JSON.stringify(D));delete d.pinHash;delete d.pinRec;delete d.pinSalt;
  const s=rnd(16),iv=rnd(12),key=await aesKey(pw,s),ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},key,new TextEncoder().encode(JSON.stringify({v:1,acc:a,data:d,at:new Date().toISOString()}))));
  const txt=TAG+b64(s)+"."+b64(iv)+"."+b64(ct),name="StatPlayer-"+norm(a.name).slice(0,20)+"-"+new Date().toISOString().slice(0,10)+".txt";
  await sendFile(name,txt);render()}catch(e){toast("Partage impossible sur cet appareil","var(--rd)")}}
async function sendFile(name,txt,mime="text/plain"){
 if(window.Android&&Android.shareFileType){if(Android.shareFileType(name,txt,mime))return;return Android.share(txt)}
 if(window.Android&&Android.shareFile){if(Android.shareFile(name,txt))return;return Android.share(txt)}
 try{const f=new File([txt],name,{type:mime});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return}}catch(e){if(e&&e.name==="AbortError")return}
 try{const u=URL.createObjectURL(new Blob([txt],{type:mime})),l=document.createElement("a");l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);toast("Fichier téléchargé")}catch(e){try{await navigator.clipboard.writeText(txt);toast("Copié : colle-le dans un message")}catch(x){}}}
let impPayload=null;
function importDlg(){impPayload=null;ov(`<h2>📥 Ouvrir un compte partagé</h2>
 <p class="mut" style="margin-top:0">Choisis le fichier reçu (ou colle son contenu), puis entre le mot de passe du compte.</p>
 <label class="b sec" style="display:block;text-align:center;margin-bottom:10px">📄 Choisir le fichier<input id="imf" type="file" accept=".txt,text/plain,*/*" style="display:none"></label>
 <div id="imn" class="mut" style="margin:-4px 0 8px;text-align:center"></div>
 <textarea id="imt" placeholder="…ou colle ici le contenu qui commence par STATPLAYER-COMPTE-1:" style="min-height:70px;margin-bottom:10px;font-size:12px"></textarea>
 ${fld("imp","Mot de passe du compte","password")}<button class="b" style="width:100%" onclick="doImport()">Déverrouiller et importer</button><button class="b sec" style="width:100%;margin-top:8px" onclick="${cur?"render()":"showAuth('home')"}">Annuler</button>`);
 $("#imf").onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{$("#imt").value=String(rd.result).trim();$("#imn").textContent="✅ "+f.name};rd.readAsText(f)}}
async function doImport(){const t=$("#imt").value.replace(/\s/g,""),pw=$("#imp").value;
 if(!t.startsWith(TAG))return toast("Fichier non reconnu","var(--rd)");
 try{const[s,iv,ct]=t.slice(TAG.length).split(".").map(ub64);const key=await aesKey(pw,s);const o=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv},key,ct)));if(o.v!==1)throw 0;impPayload=o}
 catch(e){return toast("Mot de passe incorrect ou fichier abîmé","var(--rd)")}
 const I=impPayload,ex=A.accounts.find(x=>x.id===I.acc.id);
 if(!ex){const a={...I.acc};if(A.accounts.some(x=>x.name.toLowerCase()===a.name.toLowerCase()))a.name=(a.name+" (partagé)").slice(0,30);A.accounts.push(a);saveA();
  try{localStorage.setItem(dkey(a.id),JSON.stringify(I.data))}catch(e){memS[dkey(a.id)]=I.data}
  if(cur){commitTimes();save()}openSpace(a.id,true);return toast("Compte « "+a.name+" » ajouté")}
 ov(`<h2>🔄 Ce compte existe déjà ici</h2><p style="margin-top:0">« ${esc(ex.name)} » est déjà sur ce téléphone. Fichier créé le ${esc(new Date(I.at).toLocaleString("fr-FR",{dateStyle:"short",timeStyle:"short"}))}.</p>
 <button class="b gr" style="width:100%;margin-bottom:8px" onclick="applyImport('merge')">🔀 Fusionner (recommandé)</button>
 <p class="mut" style="margin:0 0 10px">Ajoute les joueurs, matchs enregistrés et notes reçus, sans rien supprimer ici. Le match en cours de ce téléphone est conservé.</p>
 <button class="b red" style="width:100%;margin-bottom:8px" onclick="applyImport('replace')">♻️ Remplacer tout par le fichier</button>
 <button class="b sec" style="width:100%" onclick="${cur?"render()":"showAuth('home')"}">Annuler</button>`)}
function mergeData(L,I){L.players=L.players||[];(I.players||[]).forEach(p=>{const x=L.players.find(q=>q.id===p.id);if(x){x.name=p.name;x.num=p.num}else L.players.push(p)});
 L.history=L.history||[];(I.history||[]).forEach(m=>{const x=L.history.find(q=>q.id===m.id);if(x){Object.assign(x.players,m.players);x.date=m.date;x.opp=m.opp}else L.history.push(m)});
 L.obs=L.obs||[];(I.obs||[]).forEach(o=>{if(!L.obs.some(q=>q.id===o.id))L.obs.push(o)});L.consent=L.consent||I.consent;return L}
function applyImport(mode){const I=impPayload,id=I.acc.id;if(mode==="replace"&&!confirm("Remplacer toutes les données de ce compte sur ce téléphone par celles du fichier ?"))return;
 if(cur&&cur!==id){commitTimes();save()}
 const L=cur===id?D:(load(id)||blank());let N;
 if(mode==="merge")N=mergeData(L,I.data);else{N=JSON.parse(JSON.stringify(I.data));N.pinHash=L.pinHash;N.pinRec=L.pinRec;N.pinSalt=L.pinSalt}
 if(!N.history)N.history=[];if(!N.obs)N.obs=[];
 try{localStorage.setItem(dkey(id),JSON.stringify(N))}catch(e){memS[dkey(id)]=N}
 if(cur===id){D=N;unlocked=true;tab="joueurs";render()}else openSpace(id,true);
 toast(mode==="merge"?"Données fusionnées":"Données remplacées");impPayload=null}

/* ===== Export des stats : choix du format ===== */
let exScope="all";
function exportDlg(){const sc=[["all","Tout"],["match","Match en cours"],["season","Saison"]];
 ov(`<h2>📤 Exporter les stats</h2><p class="mut" style="margin-top:0">Contenu à exporter :</p>
 <div class="chips" style="margin-bottom:14px">${sc.map(([k,l])=>`<button class="chip ${exScope===k?"on":""}" onclick="exScope='${k}';exportDlg()">${l}</button>`).join("")}</div>
 <p class="mut" style="margin:0 0 8px">Choisis le format :</p>
 <button class="b" style="width:100%;margin-bottom:8px;text-align:left" onclick="exportAs('txt')">💬 Texte<br><small style="font-weight:400">Message WhatsApp, SMS, e-mail</small></button>
 <button class="b gr" style="width:100%;margin-bottom:8px;text-align:left" onclick="exportAs('csv')">📊 Tableur CSV<br><small style="font-weight:400">S'ouvre dans Excel, Google Sheets, Numbers</small></button>
 <button class="b red" style="width:100%;margin-bottom:8px;text-align:left" onclick="exportAs('pdf')">📄 PDF<br><small style="font-weight:400">Rapport à imprimer ou enregistrer en PDF</small></button>
 <button class="b sec" style="width:100%" onclick="render()">Annuler</button>`)}
function seasonRows(){return D.players.map(p=>{const H=histOf(p.id),n=H.length,T={min:0};KS.forEach(k=>T[k]=0);H.forEach(({s})=>{KS.forEach(k=>T[k]+=s[k]||0);T.min+=s.min||0});return{p,n,T,nm:avgNote(p.id)}}).filter(x=>x.n).sort((a,b)=>(b.nm||0)-(a.nm||0))}
const av1=(v,n)=>(v/n).toFixed(1).replace(".",",");
function exName(ext){return "StatPlayer-"+(D.match.opp?norm(D.match.opp).slice(0,20)+"-":"")+D.match.date+"."+ext}
function exportAs(f){commitTimes();const m=exScope!=="season",se=exScope!=="match",R=seasonRows();
 if(f==="txt"){let t=m?statsText():`🏀 Stat Player : Basket\n`;
  if(se&&R.length){t+=`\n📊 Moyennes par match (saison)\n`;R.forEach(({p,n,T,nm})=>{const l=T.lfR+T.lfM;t+=`${p.name} (${n} MJ) : ${av1(pts(T),n)} pts, ${av1(T.reb,n)} reb, ${av1(T.pas,n)} passes, ${av1(T.ctr,n)} ctr, ${av1(T.def,n)} déf, ${av1(T.per,n)} pertes, ${av1(T.fau,n)} F, LF ${l?Math.round(T.lfR*100/l)+" %":"–"}, note ${nm}/100\n`})}
  if(window.Android&&Android.share)Android.share(t);else if(navigator.share)navigator.share({text:t}).catch(()=>{});else{try{navigator.clipboard.writeText(t);toast("Copié")}catch(e){alert(t)}}return render()}
 if(f==="csv"){const q=v=>{v=String(v??"");return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v},L=[],row=a=>L.push(a.map(q).join(";"));
  if(m){row(["Match",D.match.opp?"vs "+D.match.opp:"",D.match.date]);row(["Joueur","N°","Temps de jeu","Points","Paniers 2 pts","Paniers 3 pts","LF réussis","LF tentés","Rebonds","Contres","Passes","Défenses réussies","Pertes de balle","Fautes","Évaluation","Note /100"]);
   D.players.forEach(p=>{const s=S(p.id);row([p.name,p.num||"",fmt(ptime(p.id)),pts(s),s.p2,s.p3,s.lfR,s.lfR+s.lfM,s.reb,s.ctr,s.pas,s.def,s.per,s.fau,ev(s),played(p.id)?note(s):""])});L.push("")}
  if(se&&R.length){row(["Moyennes par match (saison)"]);row(["Joueur","N°","Matchs joués","Temps moyen","Points","Rebonds","Passes","Contres","Défenses réussies","Pertes de balle","Fautes","LF %","Note moyenne /100"]);
   R.forEach(({p,n,T,nm})=>{const l=T.lfR+T.lfM;row([p.name,p.num||"",n,fmt(T.min/n),av1(pts(T),n),av1(T.reb,n),av1(T.pas,n),av1(T.ctr,n),av1(T.def,n),av1(T.per,n),av1(T.fau,n),l?Math.round(T.lfR*100/l):"",nm])});L.push("");
   row(["Historique des matchs enregistrés"]);row(["Date","Adversaire","Joueur","Temps de jeu","Points","LF réussis","LF tentés","Rebonds","Contres","Passes","Défenses réussies","Pertes de balle","Fautes","Note /100"]);
   [...D.history].sort((a,b)=>a.date<b.date?-1:1).forEach(h=>Object.entries(h.players).forEach(([id,s])=>{const p=D.players.find(x=>x.id===id);if(p)row([h.date,h.opp||"",p.name,fmt(s.min||0),pts(s),s.lfR,s.lfR+s.lfM,s.reb,s.ctr,s.pas,s.def,s.per,s.fau,note(s)])}))}
  sendFile(exName("csv"),"﻿"+L.join("\r\n"),"text/csv");return render()}
 if(f==="pdf"){const th=a=>`<tr>${a.map(x=>`<th>${x}</th>`).join("")}</tr>`,tr=a=>`<tr>${a.map(x=>`<td>${x}</td>`).join("")}</tr>`;let b="";
  if(m){b+=`<h2>Match ${D.match.opp?"vs "+esc(D.match.opp):""} – ${esc(D.match.date)}</h2><p>Score équipe : <b>${D.players.reduce((a,x)=>a+pts(S(x.id)),0)} pts</b></p><table>${th(["Joueur","Min","Pts","LF","Reb","Ctr","Pas","Déf","Pdb","F","Éval","Note"])}${D.players.map(p=>{const s=S(p.id);return tr([(p.num?"#"+esc(p.num)+" ":"")+esc(p.name),fmt(ptime(p.id)),"<b>"+pts(s)+"</b>",s.lfR+"/"+(s.lfR+s.lfM),s.reb,s.ctr,s.pas,s.def,s.per,s.fau,ev(s),played(p.id)?"<b>"+note(s)+"</b>":"–"])}).join("")}</table>`}
  if(se&&R.length){b+=`<h2>Moyennes par match – saison</h2><table>${th(["Joueur","MJ","Min","Pts","Reb","Pas","Ctr","Déf","Pdb","F","LF %","Note moy."])}${R.map(({p,n,T,nm})=>{const l=T.lfR+T.lfM;return tr([esc(p.name),n,fmt(T.min/n),"<b>"+av1(pts(T),n)+"</b>",av1(T.reb,n),av1(T.pas,n),av1(T.ctr,n),av1(T.def,n),av1(T.per,n),av1(T.fau,n),l?Math.round(T.lfR*100/l)+" %":"–","<b>"+nm+"</b>"])}).join("")}</table>`}
  if(!b)return toast("Rien à exporter","var(--yl)");
  const html=`<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><title>Stat Player – ${esc(D.match.date)}</title><style>body{font-family:Arial,sans-serif;color:#111;margin:24px;font-size:12px}h1{color:#ea580c;margin:0 0 4px;font-size:22px}h2{font-size:15px;margin:22px 0 6px;color:#0f172a;border-bottom:2px solid #f97316;padding-bottom:3px}table{width:100%;border-collapse:collapse}th{background:#0f172a;color:#fff;font-size:10px;padding:5px 3px}td{padding:5px 3px;border-bottom:1px solid #ddd;text-align:center}td:first-child,th:first-child{text-align:left}tr:nth-child(even) td{background:#f8fafc}.f{margin-top:24px;color:#666;font-size:9px}</style></head><body><h1>🏀 Stat Player : Basket</h1><div>Rapport du ${new Date().toLocaleDateString("fr-FR")}</div>${b}<p class="f">Pdb = pertes de balle · MJ = matchs joués · Éval = pts + reb + passes + contres + déf. réussies − pertes − fautes − LF ratés · Note /100 = 40 + 4 × Éval</p></body></html>`;
  if(window.AndroidPrint){AndroidPrint.print(html,"StatPlayer-"+D.match.date);toast("Choisis « Enregistrer au format PDF »");return render()}
  const fr=document.createElement("iframe");fr.style.cssText="position:fixed;width:0;height:0;border:0;right:0;bottom:0";document.body.appendChild(fr);fr.contentDocument.open();fr.contentDocument.write(html);fr.contentDocument.close();
  setTimeout(()=>{try{fr.contentWindow.focus();fr.contentWindow.print()}catch(e){sendFile(exName("html"),html,"text/html")}setTimeout(()=>fr.remove(),60000)},400);toast("Imprimante : choisis « Enregistrer en PDF »");return render()}
}
