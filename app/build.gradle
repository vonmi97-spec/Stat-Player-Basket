plugins { id 'com.android.application' }
android {
    namespace 'com.vonmi.statplayer'
    compileSdk 34
    defaultConfig {
        applicationId "com.vonmi.statplayer"
        minSdk 24
        targetSdk 34
        def run = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()
        versionCode = run + 10
        versionName = "1." + run
    }
    // Signature fixe (clé stockée dans les secrets GitHub) : chaque version s'installe par-dessus la précédente
    def ks = file("statplayer.jks")
    signingConfigs {
        fixe {
            if (ks.exists()) {
                storeFile ks
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias "statplayer"
                keyPassword System.getenv("KEYSTORE_PASSWORD")
            }
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig ks.exists() ? signingConfigs.fixe : signingConfigs.debug }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.core:core:1.13.1' }
